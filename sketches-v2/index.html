    <style>

      main { width: min(1240px, 100vw - 16px); margin: 24px auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 6px; }
      header { grid-column: 1 / -1; background: #f5f5f5; border-radius: 20px; padding: 28px 32px; }
      h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.03em; }
      header p { margin: 8px 0 0; color: #666; }
      figure { margin: 0; background: #f5f5f5; border-radius: 20px; padding: 12px; }
      img { display: block; width: 100%; aspect-ratio: 1100 / 950; object-fit: contain; filter: invert(1); }
      figcaption { display: flex; justify-content: space-between; color: #7a7a7a; font-size: 12px; text-transform: uppercase; }
    </style>
