<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coop — Sketchbook</title>
    <style>
      body { margin: 0; background: #fff; color: #121212; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 24px clamp(16px, 3vw, 40px); }
      header h1 { margin: 0; font-size: 15px; font-weight: 600; }
      header p { margin: 0; max-width: 460px; color: #777; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; padding: 0 clamp(16px, 3vw, 40px) 40px; }
      figure { margin: 0; }
      img { display: block; width: 100%; aspect-ratio: 1100 / 950; object-fit: contain; background: #f5f5f5; border-radius: 6px; }
      figcaption { display: flex; justify-content: space-between; padding: 8px 2px; color: #999; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <header>
      <h1>Coop / the sketchbook</h1>
      <p>Napkin drawings of the thing we&rsquo;re building: tables, chairs, quiet Tuesdays, and the people who fill them.</p>
    </header>
    <main>
      <figure>
        <img src="table-for-twenty.svg" alt="table for twenty sketch" loading="lazy" />
        <figcaption><span>001</span><span>table for twenty</span><span>2026/10/20</span></figcaption>
      </figure>
      <figure>
        <img src="tuesday-calendar.svg" alt="tuesday calendar sketch" loading="lazy" />
        <figcaption><span>002</span><span>tuesday calendar</span><span>2026/10/20</span></figcaption>
      </figure>
      <figure>
        <img src="storefront.svg" alt="storefront sketch" loading="lazy" />
        <figcaption><span>003</span><span>storefront</span><span>2026/10/20</span></figcaption>
      </figure>
      <figure>
        <img src="floor-plan.svg" alt="floor plan sketch" loading="lazy" />
        <figcaption><span>004</span><span>floor plan</span><span>2026/10/20</span></figcaption>
      </figure>
      <figure>
        <img src="bistro-chair.svg" alt="bistro chair sketch" loading="lazy" />
        <figcaption><span>005</span><span>bistro chair</span><span>2026/10/20</span></figcaption>
      </figure>
      <figure>
        <img src="reserved-card.svg" alt="reserved card sketch" loading="lazy" />
        <figcaption><span>006</span><span>reserved card</span><span>2026/10/20</span></figcaption>
      </figure>
      <figure>
        <img src="supper-club.svg" alt="supper club sketch" loading="lazy" />
        <figcaption><span>007</span><span>supper club</span><span>2026/10/20</span></figcaption>
      </figure>
      <figure>
        <img src="club-kit.svg" alt="club kit sketch" loading="lazy" />
        <figcaption><span>008</span><span>club kit</span><span>2026/10/20</span></figcaption>
      </figure>
    </main>
  </body>
</html>
